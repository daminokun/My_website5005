            <h2>Hubungi Saya</h2>
            <p>Sila isi borang di bawah jika anda mempunyai sebarang pertanyaan atau peluang projek.</p>
            
            <form id="borangHubungi">
                <label for="nama">Nama:</label>
                <input type="text" id="nama" required placeholder="Masukkan nama anda">

                <label for="email">E-mel:</label>
                <input type="email" id="email" required placeholder="Masukkan e-mel anda">

                <label for="mesej">Mesej:</label>
                <textarea id="mesej" rows="4" required placeholder="Tulis mesej anda di sini..."></textarea>

                <button type="submit">Hantar Mesej</button>
            </form>
